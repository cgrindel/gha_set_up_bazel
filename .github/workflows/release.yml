name: Release
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bump version and create tag
        id: bump_tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          fetch_all_tags: true
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.bump_tag.outputs.new_tag }}
          generate_release_notes: true
      - name: Move major version tag
        env:
          RELEASE_TAG: ${{ steps.bump_tag.outputs.new_tag }}
        run: |
          git fetch origin tag "${RELEASE_TAG}" --no-tags
          major="${RELEASE_TAG%%.*}"
          git tag -f "${major}" "${RELEASE_TAG}"
          git push -f origin "${major}"
